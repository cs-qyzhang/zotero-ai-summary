[tool.poetry]
name = "zotero-ai-summary"
version = "0.1.0"
description = "Academic paper summarizer"
authors = ["Qiuyang Zhang <cs.qyzhang@qq.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.162.0"
uvicorn = "^0.54.0"
markdown-it-py = "^3.0.0"
langchain-core = "^1.7.4"
langchain-openai = "^1.7.3"
pymupdf = ">=1.24.3,<2.0.0"   # 唯一 PDF 提取器；2.x 会拖入 onnxruntime 等重型依赖
langchain-text-splitters = "^1.1.3"
python-multipart = ">=0.0.31,<0.1.0"
slowapi = "^0.1.9"


[[tool.poetry.source]]
name = "mirrors"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
