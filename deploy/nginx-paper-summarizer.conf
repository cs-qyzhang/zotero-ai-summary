# 模板：由 deploy/apply.sh 渲染后安装到 /etc/nginx/sites-enabled/paper-summarizer
# 占位符：__SERVER_NAME__ / __APP_PORT__ / __REPO_URL__

server {
	listen 80;
	listen [::]:80;
	server_name __SERVER_NAME__;

	# Enforce HTTPS
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name __SERVER_NAME__;

	# 与 MAX_UPLOAD_MB 对齐（应用侧 50MB，nginx 不再放宽到 100MB）
	client_max_body_size 50M;
	client_body_timeout 30s;
	client_body_buffer_size 256k;

	# 应用侧处理上限：parse 20s + 排队；给足余量但不要无限等
	proxy_connect_timeout 10s;
	proxy_send_timeout 90s;
	proxy_read_timeout 90s;

	location = / {
		return 301 __REPO_URL__;
	}

	location = /healthz {
		# 探活接口不走限流，避免监控把配额吃光或反过来被 429 误判
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:__APP_PORT__/healthz;
	}

	location ~ ^/(?!$).* {
		limit_req zone=reqlimit burst=5 nodelay;
		limit_conn connlimit 3;
		proxy_set_header Host $host;
		# X-Real-IP 是可信值（$remote_addr 由 nginx 生成）；
		# X-Forwarded-For 保留追加语义，uvicorn 取最后一个未受信地址。
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://127.0.0.1:__APP_PORT__;
	}
}
