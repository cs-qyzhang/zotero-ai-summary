# /etc/systemd/system/paper-summarizer.service.d/10-resource-limits.conf
#
# Hardening: keep the service's blast radius explicit and make OOM/restart
# behaviour predictable. Applied by deploy/apply.sh.

[Unit]
# Never give up restarting. The unit-level start-rate limit used to turn a
# crash loop into a permanently failed unit (and even `systemctl restart` from
# the daily timer could be refused).
StartLimitIntervalSec=0

[Service]
# Budget: parent (:50M) + one PDF worker (WORKER_MEMORY_MB=384) + page cache.
MemoryHigh=600M
MemoryMax=800M
MemorySwapMax=128M
CPUQuota=150%
TasksMax=64

# If a process inside the cgroup is OOM-killed (typically the PDF worker),
# keep the service running and just return an error for that request.
# The default, `stop`, takes the whole service down and restarts it.
OOMPolicy=continue

Restart=always
RestartSec=3

# Named exit codes from pdf_worker.py that must NOT trigger a service restart
# are handled in-process; systemd restart only fires when the parent dies.
